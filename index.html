<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1c1c1c;--bg4:#242424;
  --brd:#2a2a2a;--brd2:#333;
  --txt:#f0f0f0;--txt2:#999;--txt3:#666;
  --acc:#e8ff47;--acc2:#c8e000;
  --red:#ff4d4d;--grn:#47ff8a;--blu:#47b8ff;
  --radius:10px;--radius-lg:16px;
}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
h1,h2,h3{font-weight:600;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--brd);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.logo{font-family:'DM Mono',monospace;font-size:13px;color:var(--acc);letter-spacing:0.05em;}
.logo span{color:var(--txt2);}
.header-stats{display:flex;gap:20px;}
.hstat{font-family:'DM Mono',monospace;font-size:11px;color:var(--txt3);}
.hstat b{color:var(--txt2);font-weight:500;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px);}
.sidebar{background:var(--bg2);border-right:1px solid var(--brd);padding:20px 16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.main{padding:20px 24px;}

/* SIDEBAR */
.filter-section{margin-bottom:20px;}
.filter-label{font-size:10px;font-weight:600;letter-spacing:0.1em;color:var(--txt3);text-transform:uppercase;margin-bottom:8px;}
.filter-reset{font-size:11px;color:var(--acc);cursor:pointer;float:right;font-weight:500;}
.filter-reset:hover{text-decoration:underline;}

.search-box{width:100%;background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--radius);padding:8px 12px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;margin-bottom:16px;}
.search-box:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(232,255,71,0.1);}
.search-box::placeholder{color:var(--txt3);}

.check-list{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;}
.check-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;transition:background 0.15s;}
.check-item:hover{background:var(--bg3);}
.check-item input{accent-color:var(--acc);width:14px;height:14px;cursor:pointer;}
.check-item label{cursor:pointer;font-size:12px;color:var(--txt2);flex:1;}
.check-item .cnt{font-size:10px;color:var(--txt3);font-family:'DM Mono',monospace;}

.avail-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.avail-btn{padding:6px 4px;border-radius:6px;border:1px solid var(--brd2);background:var(--bg3);color:var(--txt2);font-size:11px;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'DM Sans',sans-serif;}
.avail-btn.active-all{border-color:var(--acc);background:rgba(232,255,71,0.08);color:var(--acc);}
.avail-btn.active-avail{border-color:var(--grn);background:rgba(71,255,138,0.08);color:var(--grn);}
.avail-btn.active-booked{border-color:var(--red);background:rgba(255,77,77,0.08);color:var(--red);}

/* MAIN TOOLBAR */
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.result-count{font-size:12px;color:var(--txt3);}
.result-count b{color:var(--txt);font-weight:500;}
.sort-select{background:var(--bg3);border:1px solid var(--brd2);border-radius:6px;padding:6px 10px;color:var(--txt2);font-family:'DM Sans',sans-serif;font-size:12px;outline:none;cursor:pointer;}

/* GRID */
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}

/* CAR CARD */
.car-card{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.car-card:hover{border-color:var(--brd2);background:var(--bg3);transform:translateY(-1px);}
.car-card.available{border-left:3px solid var(--grn);}
.car-card.booked{border-left:3px solid var(--red);}

.car-rego{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--acc);letter-spacing:0.05em;}
.car-make-model{font-size:15px;font-weight:600;color:var(--txt);margin:4px 0 2px;}
.car-meta{font-size:11px;color:var(--txt3);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
.car-company{font-size:10px;color:var(--txt3);margin-top:8px;padding-top:8px;border-top:1px solid var(--brd);font-weight:500;letter-spacing:0.03em;}
.car-company.df{color:#47b8ff;}
.car-company.uc{color:#c47aff;}
.car-company.sa{color:#ff9f47;}

.status-badge{position:absolute;top:12px;right:12px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:0.05em;font-family:'DM Mono',monospace;}
.status-badge.avail{background:rgba(71,255,138,0.12);color:var(--grn);border:1px solid rgba(71,255,138,0.25);}
.status-badge.booked{background:rgba(255,77,77,0.12);color:var(--red);border:1px solid rgba(255,77,77,0.25);}

.car-rate{font-size:12px;color:var(--txt2);margin-top:8px;}
.car-rate b{color:var(--txt);font-size:14px;font-weight:600;}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--txt3);}
.empty-icon{font-size:48px;margin-bottom:12px;}

/* MODAL OVERLAY */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal{background:var(--bg2);border:1px solid var(--brd2);border-radius:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;}
.modal-header{padding:20px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;}
.modal-close{background:var(--bg3);border:1px solid var(--brd2);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt2);font-size:18px;flex-shrink:0;transition:all 0.15s;}
.modal-close:hover{background:var(--bg4);color:var(--txt);}
.modal-body{padding:20px 24px 24px;}

.modal-rego{font-family:'DM Mono',monospace;font-size:11px;color:var(--acc);letter-spacing:0.08em;margin-bottom:4px;}
.modal-title{font-size:22px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--txt2);margin-bottom:16px;}

.terms-box{background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.terms-title{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--txt3);margin-bottom:10px;}
.terms-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--brd);}
.terms-row:last-child{border-bottom:none;}
.tkey{font-size:12px;color:var(--txt3);}
.tval{font-size:12px;color:var(--txt);font-weight:500;font-family:'DM Mono',monospace;}
.tval.warn{color:#ffb347;}

.date-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.field-label{font-size:11px;color:var(--txt3);margin-bottom:4px;font-weight:500;}
.field-input{width:100%;background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--radius);padding:9px 12px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.field-input:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(232,255,71,0.1);}

.tc-check{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--bg3);border-radius:var(--radius);margin-bottom:16px;cursor:pointer;}
.tc-check input{accent-color:var(--acc);margin-top:2px;flex-shrink:0;}
.tc-check label{font-size:12px;color:var(--txt2);line-height:1.5;cursor:pointer;}

.book-btn{width:100%;padding:14px;background:var(--acc);color:#0a0a0a;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;transition:all 0.2s;letter-spacing:0.02em;}
.book-btn:hover:not(:disabled){background:var(--acc2);}
.book-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* COLOR SWATCH */
.color-swatch{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);display:inline-block;flex-shrink:0;}

/* COMPANY LEGEND */
.legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt3);}
.legend-dot{width:8px;height:8px;border-radius:2px;}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:2px;}
</style>
</head>

                  onChange:e=>setPickDate(e.target.value),
                  min:new Date().toISOString().slice(0,10),
                }),
                React.createElement('div',{className:'tc-check',onClick:()=>setAgreed(!agreed)},
                  React.createElement('input',{type:'checkbox',readOnly:true,checked:agreed}),
                  React.createElement('label',null,'I have read and accept all rental terms above, including bond, excess, minimum period, late fees, distance limits, and weekly vehicle check responsibilities.'),
                ),
                React.createElement('button',{
                  className:'book-btn',
                  disabled:!agreed||!pickDate,
                  onClick:handleBook,
                },'Submit booking request →'),
                React.createElement('div',{style:{fontSize:'11px',color:'var(--txt3)',marginTop:'10px',textAlign:'center'}},'Our team will contact you within 24 hours to confirm and collect your details.'),
              )
        )
      )
    )
  );
}

ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
</body>
</html>
