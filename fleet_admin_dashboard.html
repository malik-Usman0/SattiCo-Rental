<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fleet Admin — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & BASE ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0c0e;--s1:#131316;--s2:#1a1a1f;--s3:#222228;--s4:#2c2c34;
  --brd:rgba(255,255,255,0.06);--brd2:rgba(255,255,255,0.1);
  --txt:#f2f2f4;--txt2:#9898a8;--txt3:#55556a;--txt4:#333344;
  --acc:#c6ff47;--acc2:#a8e000;--accd:rgba(198,255,71,0.12);
  --red:#ff5252;--redd:rgba(255,82,82,0.12);--redb:rgba(255,82,82,0.25);
  --grn:#3dffaa;--grnd:rgba(61,255,170,0.12);--grnb:rgba(61,255,170,0.25);
  --blu:#47b4ff;--blud:rgba(71,180,255,0.12);
  --pur:#b47aff;--purd:rgba(180,122,255,0.12);
  --org:#ff9f47;--orgd:rgba(255,159,71,0.12);--orgb:rgba(255,159,71,0.25);
  --r:8px;--rl:14px;--rx:20px;
  --nav-w:60px;
  --panel-w:460px;
  --topbar-h:54px;
  --trans:0.18s ease;
}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--txt);font-family:'Syne',sans-serif;font-size:13px;line-height:1.5;}
button{font-family:'Syne',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Syne',sans-serif;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:2px;}

/* ── APP SHELL ── */
.shell{display:flex;height:100vh;width:100vw;overflow:hidden;}

/* ── SIDE NAV ── */
.nav{
  width:var(--nav-w);flex-shrink:0;
  background:var(--s1);
  border-right:1px solid var(--brd);
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0;gap:4px;
  z-index:50;
}
.nav-mark{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:0.12em;color:var(--acc);
  writing-mode:vertical-rl;text-orientation:mixed;
  padding:10px 0 18px;border-bottom:1px solid var(--brd);
  width:100%;text-align:center;margin-bottom:10px;
}
.nav-btn{
  width:40px;height:40px;border-radius:10px;border:none;
  background:transparent;color:var(--txt3);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;transition:all var(--trans);position:relative;
  flex-shrink:0;
}
.nav-btn:hover{background:var(--s3);color:var(--txt2);}
.nav-btn.on{background:var(--accd);color:var(--acc);}
.nav-badge{
  position:absolute;top:6px;right:6px;
  width:13px;height:13px;border-radius:50%;
  background:var(--red);color:#fff;
  font-size:8px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;
}

/* ── MAIN COLUMN ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}

/* ── TOPBAR ── */
.topbar{
  height:var(--topbar-h);flex-shrink:0;
  background:var(--s1);border-bottom:1px solid var(--brd);
  padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
.topbar-title{font-size:15px;font-weight:700;color:var(--txt);white-space:nowrap;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.pill{
  font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:500;
  padding:3px 9px;border-radius:20px;letter-spacing:0.04em;white-space:nowrap;
}
.pill-org{background:var(--orgd);color:var(--org);border:1px solid var(--orgb);}
.pill-grn{background:var(--grnd);color:var(--grn);border:1px solid var(--grnb);}
.pill-red{background:var(--redd);color:var(--red);border:1px solid var(--redb);}
.pill-dim{background:var(--s3);color:var(--txt3);border:1px solid var(--brd);}
.pill-blu{background:var(--blud);color:var(--blu);border:1px solid rgba(71,180,255,0.25);}
.pill-pur{background:var(--purd);color:var(--pur);border:1px solid rgba(180,122,255,0.25);}
.admin-chip{
  font-size:11px;color:var(--txt3);
  background:var(--s2);border:1px solid var(--brd);
  border-radius:6px;padding:4px 10px;
  display:none;
}
@media(min-width:640px){.admin-chip{display:block;}}

/* ── CONTENT AREA ── */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 32px;}

/* ── STAT CARDS ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
@media(min-width:480px){.stats{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.stats{grid-template-columns:repeat(5,1fr);}}
.stat-card{
  background:var(--s1);border:1px solid var(--brd);border-radius:var(--rl);
  padding:14px 16px;
}
.stat-val{font-size:26px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1;}
.stat-lbl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:0.1em;margin-top:5px;}

/* ── NOTIF TOAST ── */
.toast{
  background:var(--accd);border:1px solid rgba(198,255,71,0.25);
  border-radius:var(--r);padding:10px 14px;
  font-size:12px;color:var(--txt2);
  margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.toast-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0;}

/* ── SECTION HEADER ── */
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.sec-title{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--txt3);}

/* ── BUTTONS ── */
.btn{
  font-size:12px;font-weight:600;padding:7px 14px;
  border-radius:var(--r);border:1px solid var(--brd2);
  background:transparent;color:var(--txt2);
  transition:all var(--trans);white-space:nowrap;
}
.btn:hover{background:var(--s3);color:var(--txt);}
.btn-acc{background:var(--acc);border-color:var(--acc);color:#0a0a0a;}
.btn-acc:hover{background:var(--acc2);}
.btn-red{background:var(--redd);border-color:var(--redb);color:var(--red);}
.btn-grn{background:var(--grnd);border-color:var(--grnb);color:var(--grn);}

/* ── SEARCH + FILTERS ── */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:160px;position:relative;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:13px;pointer-events:none;}
.s-input{
  width:100%;background:var(--s2);border:1px solid var(--brd);
  border-radius:var(--r);padding:8px 12px 8px 32px;
  color:var(--txt);font-size:12px;outline:none;
  transition:border-color var(--trans);
}
.s-input:focus{border-color:var(--acc);}
.s-input::placeholder{color:var(--txt4);}
.s-select{
  background:var(--s2);border:1px solid var(--brd);border-radius:var(--r);
  padding:8px 10px;color:var(--txt2);font-size:12px;outline:none;
  cursor:pointer;min-width:120px;
  transition:border-color var(--trans);
}
.s-select:focus{border-color:var(--acc);}
.s-select option{background:var(--s2);}

/* ── TABLE ── */
.tbl-outer{background:var(--s1);border:1px solid var(--brd);border-radius:var(--rl);overflow:hidden;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tbl{width:100%;border-collapse:collapse;min-width:700px;}
.tbl th{
  background:var(--s2);padding:10px 12px;text-align:left;
  font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--txt3);border-bottom:1px solid var(--brd);white-space:nowrap;
}
.tbl td{
  padding:10px 12px;border-bottom:1px solid var(--brd);
  vertical-align:middle;white-space:nowrap;
}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr{transition:background var(--trans);cursor:pointer;}
.tbl tbody tr:hover td{background:var(--s2);}
.tbl tbody tr.sel td{background:rgba(198,255,71,0.04);}
.tbl tbody tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--acc);}

.rego{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc);font-weight:500;}
.make{font-weight:600;color:var(--txt);}
.dim{color:var(--txt3);font-size:12px;}

/* ── COLOUR DOT ── */
.cdot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);display:inline-block;vertical-align:middle;margin-right:6px;flex-shrink:0;}

/* ── CAR THUMB ── */
.thumb{
  width:44px;height:33px;border-radius:6px;
  background:var(--s3);border:1px solid var(--brd);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;overflow:hidden;flex-shrink:0;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}

/* ── ROW ACTIONS ── */
.row-acts{display:flex;gap:4px;align-items:center;}
.act{
  width:28px;height:28px;border-radius:6px;border:1px solid var(--brd);
  background:transparent;color:var(--txt3);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--trans);
}
.act:hover{background:var(--s3);color:var(--txt);}
.act.grn:hover{background:var(--grnd);color:var(--grn);border-color:var(--grnb);}
.act.red:hover{background:var(--redd);color:var(--red);border-color:var(--redb);}
.act.acc:hover{background:var(--accd);color:var(--acc);border-color:rgba(198,255,71,0.3);}

/* ── PANEL OVERLAY ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.65);
  z-index:200;backdrop-filter:blur(4px);
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}

/* ── SIDE PANEL ── */
.panel{
  position:fixed;top:0;right:0;bottom:0;
  width:min(var(--panel-w), 100vw);
  background:var(--s1);border-left:1px solid var(--brd2);
  z-index:201;
  display:flex;flex-direction:column;
  overflow:hidden;
  animation:slideIn 0.22s ease;
}
.panel-head{
  padding:18px 20px;border-bottom:1px solid var(--brd);
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;flex-shrink:0;
}
.panel-close{
  width:30px;height:30px;border-radius:50%;
  background:var(--s3);border:1px solid var(--brd2);
  display:flex;align-items:center;justify-content:center;
  color:var(--txt2);font-size:17px;flex-shrink:0;
  transition:all var(--trans);
}
.panel-close:hover{background:var(--s4);color:var(--txt);}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px 32px;}
.panel-sec{margin-bottom:20px;}
.panel-sec-title{
  font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--txt3);margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px solid var(--brd);
}

/* ── PANEL FORM FIELDS ── */
.f-label{font-size:11px;color:var(--txt3);font-weight:600;margin-bottom:5px;letter-spacing:0.03em;}
.f-input,.f-select{
  width:100%;background:var(--s2);border:1px solid var(--brd);
  border-radius:var(--r);padding:9px 12px;
  color:var(--txt);font-size:12px;outline:none;margin-bottom:12px;
  transition:border-color var(--trans);
}
.f-input:focus,.f-select:focus{border-color:var(--acc);}
.f-input::placeholder{color:var(--txt4);}
.f-select option{background:var(--s2);}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── IMAGE UPLOAD ── */
.img-zone{
  border:1.5px dashed var(--s4);border-radius:var(--r);
  padding:18px;text-align:center;
  cursor:pointer;position:relative;
  transition:all var(--trans);background:var(--s2);
  overflow:hidden;
}
.img-zone:hover{border-color:var(--acc);background:var(--accd);}
.img-zone.filled{border-color:var(--grn);background:var(--grnd);}
.img-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.img-zone-preview{width:100%;height:110px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px;}
.img-zone-label{font-size:12px;color:var(--txt3);}
.img-zone-sub{font-size:11px;color:var(--txt4);margin-top:3px;}

/* ── STATUS TOGGLE ── */
.status-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.st-btn{
  padding:7px 14px;border-radius:var(--r);
  border:1px solid var(--brd);background:transparent;
  color:var(--txt3);font-size:11px;font-weight:600;
  transition:all var(--trans);letter-spacing:0.02em;
}
.st-btn:hover{background:var(--s3);}
.st-avail{background:var(--grnd)!important;border-color:var(--grnb)!important;color:var(--grn)!important;}
.st-booked{background:var(--redd)!important;border-color:var(--redb)!important;color:var(--red)!important;}
.st-hidden{background:var(--s3)!important;border-color:var(--brd2)!important;color:var(--txt4)!important;}

/* ── DRIVER BLOCK ── */
.driver-card{
  background:var(--s2);border:1px solid var(--brd);
  border-radius:var(--rl);padding:14px;
}
.driver-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.driver-since{font-size:11px;color:var(--txt3);}

/* ── TABS ── */
.tabs{display:flex;gap:2px;background:var(--s3);border-radius:8px;padding:3px;margin:12px 0;}
.tab{
  flex:1;padding:6px 8px;border-radius:6px;
  border:none;background:transparent;
  color:var(--txt3);font-family:'Syne',sans-serif;font-size:11px;font-weight:600;
  cursor:pointer;transition:all var(--trans);text-align:center;
}
.tab.on{background:var(--s1);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,0.5);}

/* ── DETAIL GRID ── */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.dg-row{padding:7px 0;border-bottom:1px solid var(--brd);}
.dg-row:last-child{border-bottom:none;}
.dg-row.span-2{grid-column:span 2;}
.dk{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px;}
.dv{font-size:12px;color:var(--txt);font-weight:600;}
.dv.mono{font-family:'JetBrains Mono',monospace;color:var(--acc);}

/* ── DOC CHIPS ── */
.doc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.doc-chip{
  font-size:11px;padding:4px 10px;border-radius:20px;
  display:flex;align-items:center;gap:5px;
}
.doc-chip.yes{background:var(--grnd);color:var(--grn);border:1px solid var(--grnb);}
.doc-chip.no{background:var(--s3);color:var(--txt4);border:1px solid var(--brd);}

/* ── DANGER ZONE ── */
.danger-zone{
  background:var(--redd);border:1px solid var(--redb);
  border-radius:var(--r);padding:14px;
}
.danger-title{font-size:11px;font-weight:700;color:var(--red);margin-bottom:8px;letter-spacing:0.05em;text-transform:uppercase;}
.danger-btns{display:flex;gap:8px;flex-wrap:wrap;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:56px 20px;color:var(--txt3);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-text{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--txt2);}
.empty-sub{font-size:12px;}

/* ── APPS TABLE driver col ── */
.driver-col{font-weight:600;color:var(--txt);}

/* ── RESPONSIVE MOBILE NAV ── */
@media(max-width:600px){
  :root{--nav-w:0px;--panel-w:100vw;}
  .nav{display:none;}
  .mob-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--s1);border-top:1px solid var(--brd);
    padding:8px 0 12px;z-index:100;
    justify-content:space-around;
  }
  .mob-nav-btn{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:transparent;border:none;color:var(--txt3);font-size:10px;
    font-family:'Syne',sans-serif;font-weight:600;padding:6px 16px;
    border-radius:var(--r);transition:all var(--trans);position:relative;
  }
  .mob-nav-btn.on{color:var(--acc);}
  .mob-nav-btn-icon{font-size:20px;}
  .mob-badge{
    position:absolute;top:2px;right:8px;
    width:14px;height:14px;border-radius:50%;
    background:var(--red);color:#fff;font-size:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
  }
  .content{padding-bottom:80px;}
}
@media(min-width:601px){.mob-nav{display:none;}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
/* ── API SETUP ── */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby0xYrkoyFuOpDmL4PVhNOVcn_nQ7uKYnRz8lGc7skoRItkaZL6BoOBCbj_s2X9gGt3/exec';

const API = {
  getFleet:    () => fetch(SCRIPT_URL + '?action=getFleet').then(r => r.json()),
  getBookings: () => fetch(SCRIPT_URL + '?action=getBookings').then(r => r.json()),
  post: (body) => fetch(SCRIPT_URL, {
    method: 'POST', body: JSON.stringify(body)
  }).then(r => r.json()),
  submitApplication: (data) => API.post({ action: 'submitApplication', ...data }),
  approveDriver:  (refId, notes) => API.post({ action: 'approveDriver', refId, adminNotes: notes }),
  rejectDriver:   (refId, reason) => API.post({ action: 'rejectDriver', refId, reason }),
  updateCarStatus:(rego, status) => API.post({ action: 'updateCarStatus', rego, status }),
  addCar:    (data) => API.post({ action: 'addCar', ...data }),
  removeCar: (rego) => API.post({ action: 'removeCar', rego }),
};

/* ── REACT APP ── */
const {useState,useMemo,useRef,useEffect}=React;
const c=React.createElement;

/* ── DATA ── */
const CMAP={WHI:'#f4f4f4',SIL:'#b8b8c0',BLK:'#1c1c20',GRY:'#7a7a8a',BLU:'#4a90d9',RED:'#e84040',GRN:'#3dba6a',CRM:'#f0ebe0'};

const COKEY={'Driver Flex':'blu','Unity Consulting':'pur','Satti & Co':'org'};

const DRIVERS={
  '2DF7AC':{fn:'James',ln:'Patel',ph:'0412 345 678',em:'james.p@email.com',addr:'12 Collins St, Melbourne VIC 3000',dob:'1988-04-15',lic:'123456789',ls:'VIC',lx:'2027-04-15',plat:'Uber Eats',since:'2024-11-01',stat:'approved',km:31200,docs:['Licence front','Licence back','Proof of address','Platform doc']},
  '2CX8YI':{fn:'Sara',ln:'Nguyen',ph:'0423 456 789',em:'sara.n@email.com',addr:'45 Swanston St, Melbourne VIC 3000',dob:'1993-07-22',lic:'987654321',ls:'VIC',lx:'2026-07-22',plat:'Uber (rideshare)',since:'2024-12-15',stat:'approved',km:28500,docs:['Licence front','Proof of address']},
  '1TV4FN':{fn:'Mohammed',ln:'Al-Rashid',ph:'0434 567 890',em:'moh.alr@email.com',addr:'77 Bourke St, Melbourne VIC 3000',dob:'1985-02-10',lic:'456789123',ls:'VIC',lx:'2028-02-10',plat:'DoorDash',since:'2025-01-05',stat:'pending',km:0,docs:['Licence front','Licence back','Proof of address']},
  'CPN655':{fn:'Anh',ln:'Tran',ph:'0445 678 901',em:'anh.tran@email.com',addr:'23 Lonsdale St, Melbourne VIC 3000',dob:'1990-09-30',lic:'321654987',ls:'VIC',lx:'2026-09-30',plat:'Uber Eats',since:'2025-02-20',stat:'approved',km:19800,docs:['Licence front','Proof of address','Platform doc']},
};

const INIT_APPS=[
  {id:'APP001',rego:'1TV4FN',driver:'Mohammed Al-Rashid',submitted:'2025-05-20',rate:240,pickup:'2025-06-01',status:'pending'},
  {id:'APP002',rego:'2DD1NF',driver:'Lucy Chen',submitted:'2025-05-21',rate:240,pickup:'2025-06-05',status:'pending'},

function StatusPill({s}){
  const map={available:'grn',booked:'red',hidden:'dim',PENDING:'org',APPROVED:'grn',REJECTED:'red',pending:'org',approved:'grn',rejected:'red'};

}
function CompPill({co}){
  return c('span',{className:`pill pill-${COKEY[co]||'dim'}`},co.split(' ')[0]);

/* ── APP ── */
function App(){
  const [tab,setTab]=useState('fleet');
  const [fleet,setFleet]=useState([]); // Initialised empty to fetch real data
  const [apps,setApps]=useState([]);
  const [panel,setPanel]=useState(null); 
  const [search,setSearch]=useState('');
  const [fCo,setFCo]=useState('');
  const [fSt,setFSt]=useState('');
  const [toast,setToast]=useState('');

  const pendingCt=apps.filter(a=>a.status==='pending').length;

  function notify(msg){setToast(msg);setTimeout(()=>setToast(''),3000);}

  /* ── API INTEGRATION LOGIC ── */
  const refreshData = async () => {
    try {
      const [fleetData, appsData] = await Promise.all([
        API.getFleet(),
        API.getBookings()
      ]);
      // Use fallback mock data if API returns undefined or empty array (for testing UI)
      setFleet(fleetData && fleetData.length ? fleetData : mkFleet());
      setApps(appsData && appsData.length ? appsData : INIT_APPS);
    } catch (err) {
      console.error("Data refresh failed", err);
      // Fallback for visual testing if API fails
      if(fleet.length === 0) setFleet(mkFleet());
      if(apps.length === 0) setApps(INIT_APPS);
    }
  };

  useEffect(() => {
    refreshData();
  }, []);

  const rows=useMemo(()=>{
    let r=fleet;
    if(search)r=r.filter(x=>`${x.rego} ${x.make} ${x.model}`.toLowerCase().includes(search.toLowerCase()));
    if(fCo)r=r.filter(x=>x.company===fCo);
    if(fSt)r=r.filter(x=>x.status===fSt);
    return r;
  },[fleet,search,fCo,fSt]);

  /* API Handlers */
  async function setStat(rego, st){
    // Optimistic UI update
    setFleet(f=>f.map(x=>x.rego===rego?{...x,status:st}:x));
    if(panel&&panel.data&&panel.data.rego===rego)setPanel(p=>({...p,data:{...p.data,status:st}}));
    notify(`Updating ${rego}...`);

    try {
      await API.updateCarStatus(rego, st);
      await refreshData();
      notify(`${rego} → ${st.toUpperCase()}`);
    } catch (err) {
      notify(`Error updating ${rego}`);
      refreshData(); // Revert on failure
    }
  }

  async function delCar(rego){
    if(!window.confirm(`Remove ${rego}?`))return;
    notify(`Removing ${rego}...`);
    try {
      await API.removeCar(rego);
      await refreshData();
      if(panel&&panel.data&&panel.data.rego===rego)setPanel(null);
      notify(`${rego} removed`);
    } catch (err) {
      notify(`Error removing ${rego}`);
    }
  }

  async function doAdd(carData){
    notify(`Adding ${carData.rego}...`);
    try {
      await API.addCar(carData);
      await refreshData();
      setPanel(null);
      notify(`${carData.rego} added`);
    } catch (err) {
      notify(`Error adding vehicle`);
    }
  }

  async function approvApp(refId){
    notify(`Approving ${refId}...`);
    try {
      await API.approveDriver(refId, "Approved via Admin Dashboard");
      await refreshData();
      notify(`${refId} approved`);
    } catch (err) {
      notify(`Error approving ${refId}`);
    }
  }

  async function rejectApp(refId){
    notify(`Rejecting ${refId}...`);
    try {
      await API.rejectDriver(refId, "Rejected via Admin Dashboard");
      await refreshData();
      notify(`${refId} rejected`);
    } catch (err) {
      notify(`Error rejecting ${refId}`);
    }
  }

  function setImg(rego,file){
    const url=URL.createObjectURL(file);
    setFleet(f=>f.map(x=>x.rego===rego?{...x,img:url}:x));
    if(panel&&panel.data&&panel.data.rego===rego)setPanel(p=>({...p,data:{...p.data,img:url}}));
    notify(`Photo updated for ${rego}`);
  }
  function updField(rego,k,v){
    setFleet(f=>f.map(x=>x.rego===rego?{...x,[k]:v}:x));

    const [f,setF]=useState({rego:'',make:'TOYOTA',model:'',color:'WHI',year:'2024',company:'Driver Flex',rate:'200',km:'0'});
    const [prev,setPrev]=useState(null);
    const imgRef=useRef();
    const upd=(k,v)=>setF(x=>({...x,[k]:v}));
    function submit(){
      if(!f.rego.trim()||!f.model.trim()){alert('Rego and model are required.');return;}
      doAdd({...f,year:parseInt(f.year),rate:parseInt(f.rate),km:parseInt(f.km),img:prev, status:'available'});
    }
    return c(React.Fragment,null,
      c('div',{className:'panel-head'},
        c('div',null,
          c('div',{style:{fontFamily:'JetBrains Mono,monospace',fontSize:'10px',color:'var(--acc)',letterSpacing:'0.1em',marginBottom:'4px'}},'NEW VEHICLE'),
          c('div',{style:{fontSize:'17px',fontWeight:'800'}},'Add to fleet'),
          c('div',{style:{fontSize:'12px',color:'var(--txt3)',marginTop:'3px'}},'Fill in the details below'),
        ),
        c('button',{className:'panel-close',onClick:()=>setPanel(null)},'×'),
      ),
      c('div',{className:'panel-body'},
        c('div',{className:'panel-sec'},
          c('div',{className:'panel-sec-title'},'Vehicle photo'),
          c('div',{className:`img-zone${prev?' filled':''}`,onClick:()=>imgRef.current&&imgRef.current.click()},
            c('input',{type:'file',accept:'image/*',ref:imgRef,style:{display:'none'},onChange:e=>{if(e.target.files[0])setPrev(URL.createObjectURL(e.target.files[0]));}}),
            prev&&c('img',{src:prev,alt:'',className:'img-zone-preview'}),
            c('div',{className:'img-zone-label'},prev?'Click to replace':'📸  Upload photo (optional)'),
            c('div',{className:'img-zone-sub'},'JPG or PNG'),
          ),
        ),
        c('div',{className:'panel-sec'},
          c('div',{className:'panel-sec-title'},'Vehicle details'),
          c('div',{className:'f-label'},'Rego plate *'),
          c('input',{className:'f-input',placeholder:'e.g. 2CF4EA',value:f.rego,onChange:e=>upd('rego',e.target.value.toUpperCase())}),
          c('div',{className:'f-row'},
            c('div',null,c('div',{className:'f-label'},'Make'),
              c('select',{className:'f-select',value:f.make,onChange:e=>upd('make',e.target.value)},
                ['TOYOTA','HONDA','MAZDA','FORD','HOLDEN','NISSAN','SUZUKI','HYUNDAI','OTHER'].map(m=>c('option',{key:m,value:m},m))
              )
            ),
            c('div',null,c('div',{className:'f-label'},'Model *'),c('input',{className:'f-input',placeholder:'e.g. CAMRY',value:f.model,onChange:e=>upd('model',e.target.value.toUpperCase())})),
            c('div',null,c('div',{className:'f-label'},'Year'),c('input',{className:'f-input',type:'number',min:'1990',max:'2030',value:f.year,onChange:e=>upd('year',e.target.value)})),
            c('div',null,c('div',{className:'f-label'},'Colour'),
              c('select',{className:'f-select',value:f.color,onChange:e=>upd('color',e.target.value)},
                Object.entries(CNAME).map(([k,v])=>c('option',{key:k,value:k},v))
              )
            ),
          ),
          c('div',{className:'f-label'},'Company'),
          c('select',{className:'f-select',value:f.company,onChange:e=>upd('company',e.target.value)},
            ['Driver Flex','Unity Consulting','Satti & Co'].map(x=>c('option',{key:x,value:x},x))
          ),
          c('div',{className:'f-row'},
            c('div',null,c('div',{className:'f-label'},'Daily rate ($AUD)'),c('input',{className:'f-input',type:'number',value:f.rate,onChange:e=>upd('rate',e.target.value)})),
            c('div',null,c('div',{className:'f-label'},'Odometer (km)'),c('input',{className:'f-input',type:'number',value:f.km,onChange:e=>upd('km',e.target.value)})),
          ),
        ),
        c('div',{style:{display:'flex',gap:'8px'}},
          c('button',{className:'btn btn-acc',style:{flex:1,padding:'11px'},onClick:submit},'Add to fleet'),
          c('button',{className:'btn',style:{padding:'11px 18px'},onClick:()=>setPanel(null)},'Cancel'),
        ),
      ),
    );
  }

  return c('div',{className:'shell'},
    // desktop side nav
    c('nav',{className:'nav'},
      c('div',{className:'nav-mark'},'FLEET'),
      c(NB,{id:'fleet',icon:'🚗'}),
      c(NB,{id:'apps',icon:'📋',badge:pendingCt>0?pendingCt:null}),
    ),
    // main
    c('div',{className:'main'},
      c('header',{className:'topbar'},
        c('div',{className:'topbar-left'},
          c('span',{className:'topbar-title'},tab==='fleet'?'Fleet Management':'Booking Applications'),
        ),
        c('div',{className:'topbar-right'},
          pn>0&&c('span',{className:'pill pill-org'},`${pn} pending`),
          c('span',{className:'admin-chip'},'Admin · Super user'),
        ),
      ),
      c('div',{className:'content'},
        tab==='fleet'&&c(FleetTab,null),
        tab==='apps'&&c(AppsTab,null),
      ),
    ),
    // mobile bottom nav
    c('nav',{className:'mob-nav'},
      c(MNB,{id:'fleet',icon:'🚗',label:'Fleet'}),
      c(MNB,{id:'apps',icon:'📋',label:'Apps',badge:pendingCt>0?pendingCt:null}),
    ),
    // panel
    panel&&c(React.Fragment,null,
      c('div',{className:'overlay',onClick:()=>setPanel(null)}),
      c('div',{className:'panel'},
        panel.type==='car'&&c(CarPanel,{key:panel.data.rego}),
        panel.type==='add'&&c(AddPanel,null),
      ),
    ),
  );
}

ReactDOM.render(c(App),document.getElementById('root'));
</script>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby0xYrkoyFuOpDmL4PVhNOVcn_nQ7uKYnRz8lGc7skoRItkaZL6BoOBCbj_s2X9gGt3/exec';

const API = {
  getFleet:    () => fetch(SCRIPT_URL + '?action=getFleet').then(r => r.json()),
  getBookings: () => fetch(SCRIPT_URL + '?action=getBookings').then(r => r.json()),
  post: (body) => fetch(SCRIPT_URL, {
    method: 'POST', body: JSON.stringify(body)
  }).then(r => r.json()),
  submitApplication: (data) => API.post({ action: 'submitApplication', ...data }),
  approveDriver:  (refId, notes) => API.post({ action: 'approveDriver', refId, adminNotes: notes }),
  rejectDriver:   (refId, reason) => API.post({ action: 'rejectDriver', refId, reason }),
  updateCarStatus:(rego, status) => API.post({ action: 'updateCarStatus', rego, status }),
  addCar:    (data) => API.post({ action: 'addCar', ...data }),
  removeCar: (rego) => API.post({ action: 'removeCar', rego }),
};
</script>

</body>
</html>
